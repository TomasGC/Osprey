name: Push-CI

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-pipeline:
    uses: TomasGC/condor/.github/workflows/kotlin-push-ci.yml@feature/25-private-fixtures
    secrets: inherit
    with:
      app-name: osprey
      unit-tasks: '[":core:test", ":app:testDebugUnitTest", ":desktop:test"]'
      integration-mock-tasks: '[":core:integrationMock", ":desktop:integrationMock"]'
      integration-real-tasks: '[":core:integrationReal", ":desktop:integrationReal"]'
      # The end-to-end checks of the real app, one per environment (Condor#23): :app-instrumented on the emulator,
      # :desktop:e2e on Windows and on Linux.
      app-environments: '["android", "windows", "linux"]'
      # Merged line coverage of :core, :desktop and :app without the Compose screens (#46). :core is held
      # at 100% line and branch by `:core:koverVerify`, which the coverage report task depends on.
      coverage-threshold: 75
      # The real photos of the private Osprey-fixtures repository (#76, Condor#25): read with a deploy key held by the
      # `fixtures` environment, which only feature/**, bugfix/** and main can use. A missing folder fails the run.
      # ffmpeg decodes the HEIC photos and the video frames the desktop tests read.
      install-ffmpeg: true
      fixtures-repo: TomasGC/Osprey-fixtures
      require-fixtures: true
      fixtures-environment: fixtures
      android-fixtures-device-path: /data/local/tmp/osprey-fixtures
