name: PR-CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-checks:
    uses: TomasGC/condor/.github/workflows/common-pr-ci.yml@main
    with:
      # Osprey's context lives in the wiki: there is no contexts/ folder to check.
      context-check: false
