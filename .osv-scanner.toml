# OSV Scanner configuration
# Build tool dependencies pulled in by Android Gradle Plugin (AGP) are excluded
# because they are never shipped in the APK and only affect the build environment.
# Copied from the sibling project Anglerfish, which hit the same AGP-internal build-tool
# dependencies (same AGP/Gradle version family) — same overrides apply here.

[[PackageOverrides]]
name = "com.google.guava:guava"
version = "33.4.0-jre"
ecosystem = "Maven"
ignore = true
reason = "AGP 9.5.1 build tool dependency, not shipped in the APK or the desktop app; the build now resolves Guava 33.8.0-jre (root build.gradle.kts), this version is only listed in the dependency metadata. GHSA-xxph-c9ww-hj94 (High) is a memory exhaustion when deserializing attacker-controlled streams, which neither the build nor the tests do. Fixed in 33.7.2: look again on 2026-12-05 and drop this entry once the AGP ships a Guava of that version."

[[PackageOverrides]]
name = "org.apache.commons:commons-lang3"
ecosystem = "Maven"
ignore = true
reason = "AGP build tool dependency, not shipped in APK"

[[PackageOverrides]]
name = "org.apache.httpcomponents:httpclient"
version = "4.5.6"
ecosystem = "Maven"
ignore = true
reason = "AGP build tool dependency, not shipped in APK"

[[PackageOverrides]]
name = "org.bitbucket.b_c:jose4j"
ecosystem = "Maven"
ignore = true
reason = "AGP/Gradle daemon JWT library, not shipped in APK"

[[PackageOverrides]]
name = "org.bouncycastle:bcpkix-jdk18on"
ecosystem = "Maven"
ignore = true
reason = "AGP/Gradle daemon SSL/TLS library, not shipped in APK"

[[PackageOverrides]]
name = "org.bouncycastle:bcprov-jdk18on"
ecosystem = "Maven"
ignore = true
reason = "AGP/Gradle daemon cryptography library, not shipped in APK"

[[PackageOverrides]]
name = "org.freemarker:freemarker"
ecosystem = "Maven"
ignore = true
reason = "AGP/Gradle daemon templating library, not shipped in APK"

[[PackageOverrides]]
name = "org.jdom:jdom2"
ecosystem = "Maven"
ignore = true
reason = "AGP/Gradle XML parsing library, not shipped in APK"
